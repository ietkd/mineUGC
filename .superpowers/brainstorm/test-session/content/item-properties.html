<h2>自定义物品属性</h2>
<p class="subtitle">需要支持哪些自定义维度？（多选）</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="basic" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>基础属性</h3>
      <p>名称、Lore、附魔、物品模型 (CustomModelData / ModelEngine)</p>
    </div>
  </div>
  <div class="option" data-choice="stats" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>数值属性</h3>
      <p>攻击力、攻速、护甲、移动速度、生命值加成等</p>
    </div>
  </div>
  <div class="option" data-choice="abilities" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>主动技能</h3>
      <p>右键释放技能、左键特殊攻击、潜行效果等</p>
    </div>
  </div>
  <div class="option" data-choice="passive" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>被动效果</h3>
      <p>穿戴时获得药水效果、概率触发、光环效果等</p>
    </div>
  </div>
  <div class="option" data-choice="sets" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>套装系统</h3>
      <p>多件装备凑齐触发额外属性/效果</p>
    </div>
  </div>
  <div class="option" data-choice="crafting" onclick="toggleSelect(this)">
    <div class="letter">F</div>
    <div class="content">
      <h3>自定义配方</h3>
      <p>自定义合成配方、锻造配方等</p>
    </div>
  </div>
  <div class="option" data-choice="durability" onclick="toggleSelect(this)">
    <div class="letter">G</div>
    <div class="content">
      <h3>特殊耐久/消耗品</h3>
      <p>自定义耐久度、使用次数、消耗品、可堆叠特殊物品</p>
    </div>
  </div>
  <div class="option" data-choice="other" onclick="toggleSelect(this)">
    <div class="letter">H</div>
    <div class="content">
      <h3>其他</h3>
      <p>我有不同的想法，在终端里告诉你</p>
    </div>
  </div>
</div>
